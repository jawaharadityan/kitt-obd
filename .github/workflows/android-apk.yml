name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on the "apk-latest" release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Web tests (read-only allowlist, parser, DTC lookup)
        run: npm test

      - name: Copy web app into the Android project
        run: npm run build:web && npx cap sync android

      - name: Java tests and signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kitt-obd.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kitt-obd-apk-${{ github.run_number }}
          path: kitt-obd.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest
          NOTES="Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Download kitt-obd.apk below and open it on the phone to install or update."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "KITT OBD Android app (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" kitt-obd.apk --clobber
